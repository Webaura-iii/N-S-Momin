<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>N.S Collection - Owner Admin Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body class="min-h-screen bg-[#F7F4EE] text-zinc-800 font-sans antialiased">

  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl border border-[#EAE3D2] shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 rounded-full border border-[#C5A059] flex items-center justify-center font-serif text-lg font-bold text-[#5C1D24] mx-auto">
          NS
        </div>
        <h1 class="font-serif font-bold text-2xl text-[#5C1D24]">N.S COLLECTION</h1>
        <p class="text-[10px] uppercase tracking-widest text-[#C5A059] font-semibold">Owner Admin Suite Authentication</p>
      </div>

      <div id="login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-zinc-700 mb-1">Email / Admin ID</label>
          <input id="login-email" type="text" value="admin@nscollection.com" required class="w-full" placeholder="admin@nscollection.com" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-700 mb-1">Password</label>
          <input id="login-password" type="password" value="admin123" required class="w-full" placeholder="••••••••" />
        </div>

        <button type="submit" class="w-full py-2.5 bg-[#5C1D24] hover:bg-[#47161c] text-white text-xs font-semibold rounded-xl transition-colors cursor-pointer flex items-center justify-center gap-2">
          <i data-lucide="lock" class="w-4 h-4 text-[#C5A059]"></i>
          <span>Authenticate &amp; Enter Panel</span>
        </button>
      </form>

      <div class="p-3 bg-[#FAF7F2] rounded-xl border border-[#EAE3D2] text-[11px] text-zinc-500 text-center">
        Demo Password: <code class="font-bold text-[#5C1D24]">admin123</code>
      </div>
    </div>
  </div>

  <!-- ADMIN APP SUITE CONTAINER -->
  <div id="admin-app" class="hidden min-h-screen flex">
    <!-- SIDEBAR -->
    <aside class="w-64 bg-[#FAF7F2] border-r border-[#EAE3D2] flex flex-col justify-between shrink-0">
      <div>
        <!-- Brand Header -->
        <div class="p-6 border-b border-[#EAE3D2]">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full border border-[#C5A059] flex items-center justify-center font-serif text-sm font-bold text-[#5C1D24]">
              NS
            </div>
            <div>
              <h1 class="font-serif font-bold text-lg text-[#5C1D24] leading-none tracking-wide">N.S COLLECTION</h1>
              <p class="text-[9px] uppercase tracking-widest text-[#C5A059] mt-1 font-semibold">Redefining Modest Fashion</p>
            </div>
          </div>
          <div class="mt-4 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#5C1D24]/10 text-[#5C1D24] text-[11px] font-semibold">
            <i data-lucide="sparkles" class="w-3 h-3 text-[#C5A059]"></i>
            <span>Owner Admin Suite</span>
          </div>
        </div>

        <!-- Navigation -->
        <nav class="p-3 space-y-1">
          <button data-tab="dashboard" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
              <span>Dashboard</span>
            </div>
          </button>

          <button data-tab="products" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="package" class="w-4 h-4"></i>
              <span>Products &amp; Hampers</span>
            </div>
          </button>

          <button data-tab="orders" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="shopping-cart" class="w-4 h-4"></i>
              <span>Orders Management</span>
            </div>
            <span id="nav-order-badge" class="bg-amber-200 text-amber-900 text-[10px] font-bold px-2 py-0.5 rounded-full">0</span>
          </button>

          <button data-tab="reviews" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="heart" class="w-4 h-4"></i>
              <span>Customer Reviews</span>
            </div>
          </button>

          <button data-tab="site_content" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span>Site Content</span>
            </div>
          </button>

          <button data-tab="settings" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-medium text-zinc-700 hover:bg-[#EFE8DA] transition-colors cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="settings" class="w-4 h-4"></i>
              <span>Settings &amp; Backups</span>
            </div>
          </button>
        </nav>
      </div>

      <!-- Footer Action -->
      <div class="p-4 border-t border-[#EAE3D2] space-y-2">
        <a href="#" onclick="alert('Navigating to Live Storefront'); return false;" class="w-full py-2 px-3 border border-[#C5A059] rounded-xl text-xs text-[#5C1D24] font-medium flex items-center justify-center gap-1.5 hover:bg-[#EFE8DA] transition-colors">
          <i data-lucide="external-link" class="w-3.5 h-3.5"></i>
          <span>View Public Store</span>
        </a>
        <button onclick="handleLogout()" class="w-full py-2 px-3 text-xs text-zinc-500 flex items-center gap-2 hover:text-red-700 transition-colors cursor-pointer">
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Log Out</span>
        </button>
      </div>
    </aside>

    <!-- MAIN PANEL CONTENT -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
      <header class="h-14 bg-[#FAF7F2] border-b border-[#EAE3D2] px-8 flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2 text-xs">
          <span class="text-zinc-500">N.S Collection</span>
          <span class="text-zinc-400">/</span>
          <span id="breadcrumb-title" class="font-semibold text-zinc-800">Dashboard</span>
        </div>
        <div class="flex items-center gap-3">
          <button onclick="alert('Live storefront preview activated.');" class="px-3 py-1.5 rounded-full border border-[#C5A059] text-xs font-medium text-[#5C1D24] flex items-center gap-1.5 bg-white hover:bg-[#FAF7F2] cursor-pointer">
            <i data-lucide="external-link" class="w-3.5 h-3.5 text-[#C5A059]"></i>
            <span>Live Storefront Preview</span>
          </button>
          <div class="flex items-center gap-2 pl-3 border-l border-[#EAE3D2]">
            <div class="w-7 h-7 rounded-full bg-[#5C1D24] text-[#E6CA85] flex items-center justify-center font-serif font-bold text-xs">NS</div>
            <span id="admin-user-display" class="text-xs font-medium text-zinc-800">Noor Saba Momin</span>
          </div>
        </div>
      </header>

      <main id="tab-content" class="p-8 space-y-6 flex-1">
        <!-- Dynamic Content Rendered Here -->
      </main>
    </div>
  </div>

  <!-- MODALS CONTAINER -->
  <div id="modal-container"></div>

  <script src="admin.js"></script>
</body>
</html>
